# Stack locale Show360 — LiveKit self-host + Redis + MinIO + API
#
# Usage (depuis la racine du repo) :
#   docker compose -f deploy/docker-compose.yml up --build
#
# Mode cloud : ne pas lancer le service livekit ; utiliser deploy/cloud/.env.cloud

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.8.4
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: show360
      MINIO_ROOT_PASSWORD: show360secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      SHOW360_API_BIND: "0.0.0.0:8080"
      SHOW360_PUBLIC_BASE_URL: "http://127.0.0.1:8080"
      SHOW360_LIVEKIT_MODE: "self_hosted"
      # URL vue par les clients du host (pas le hostname docker).
      SHOW360_LIVEKIT_URL: "ws://127.0.0.1:7880"
      SHOW360_LIVEKIT_API_KEY: "devkey"
      SHOW360_LIVEKIT_API_SECRET: "secret"
      SHOW360_LIVEKIT_TOKEN_TTL: "3600"
      RUST_LOG: "info,show360_api=debug"
    ports:
      - "8080:8080"
    depends_on:
      - livekit
    restart: unless-stopped

volumes:
  minio_data:
